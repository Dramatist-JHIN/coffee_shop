<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素咖啡店 - 顾客</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <h1>☕ 像素咖啡店</h1>
        <div class="user-info">
            <span id="userName"></span>
            <span class="status status-pending" style="background:#4169E1;color:white;">顾客</span>
            <button class="btn btn-small" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <!-- 咖啡菜单 -->
        <div class="card">
            <div class="card-title">咖啡菜单</div>
            <div id="menuGrid" class="grid grid-4">
                <!-- 菜单项会动态加载 -->
            </div>
            <div id="menuEmpty" class="empty" style="display:none;">
                <div class="empty-icon">☕</div>
                <p>暂无咖啡</p>
            </div>
        </div>

        <!-- 我的订单 -->
        <div class="card">
            <div class="card-title">我的订单</div>
            <div id="orderList">
                <!-- 订单会动态加载 -->
            </div>
            <div id="orderEmpty" class="empty" style="display:none;">
                <div class="empty-icon">📋</div>
                <p>暂无订单</p>
            </div>
        </div>
    </div>

    <!-- 购物车 -->
    <div id="cart" class="cart" style="display:none;">
        <div class="cart-title">🛒 购物车</div>
        <div id="cartItems"></div>
        <div class="cart-total">总计: ¥<span id="cartTotal">0.00</span></div>
        <div class="form-group">
            <input type="text" id="orderRemark" class="input" placeholder="备注（可选）">
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="clearCart()">清空</button>
            <button class="btn btn-primary" onclick="submitOrder()">下单</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // 检查登录
        var user = checkLogin();
        if (user) {
            document.getElementById('userName').textContent = user.nickname || user.username;
        }

        // 购物车数据
        var cart = [];

        // 加载菜单
        function loadMenu() {
            get('/coffee', function(res) {
                var grid = document.getElementById('menuGrid');
                var empty = document.getElementById('menuEmpty');

                if (res.code === 200 && res.data && res.data.length > 0) {
                    grid.innerHTML = '';
                    empty.style.display = 'none';

                    res.data.forEach(function(coffee) {
                        var item = document.createElement('div');
                        item.className = 'menu-item';
                        if (coffee.stock < 1) {
                            item.style.opacity = '0.5';
                            item.style.cursor = 'not-allowed';
                        }
                        item.innerHTML = '<div class="icon">☕</div>' +
                            '<div class="name">' + coffee.name + '</div>' +
                            '<div class="desc">' + (coffee.description || '') + '</div>' +
                            '<div class="price">¥' + coffee.price + '</div>' +
                            '<div class="stock ' + (coffee.stock < 10 ? 'low' : '') + '">库存: ' + coffee.stock + '</div>';

                        if (coffee.stock > 0) {
                            item.onclick = function() {
                                addToCart(coffee);
                            };
                        }
                        grid.appendChild(item);
                    });
                } else {
                    grid.innerHTML = '';
                    empty.style.display = 'block';
                }
            });
        }

        // 添加到购物车
        function addToCart(coffee) {
            var existing = null;
            for (var i = 0; i < cart.length; i++) {
                if (cart[i].coffeeId === coffee.id) {
                    existing = cart[i];
                    break;
                }
            }

            if (existing) {
                if (existing.quantity >= coffee.stock) {
                    showAlert('库存不足', 'error');
                    return;
                }
                existing.quantity++;
            } else {
                cart.push({
                    coffeeId: coffee.id,
                    name: coffee.name,
                    price: coffee.price,
                    quantity: 1,
                    maxStock: coffee.stock
                });
            }
            updateCartUI();
            showAlert('已添加: ' + coffee.name, 'success');
        }

        // 更新购物车界面
        function updateCartUI() {
            var cartDiv = document.getElementById('cart');
            var cartItems = document.getElementById('cartItems');
            var cartTotal = document.getElementById('cartTotal');

            if (cart.length === 0) {
                cartDiv.style.display = 'none';
                return;
            }

            cartDiv.style.display = 'block';
            cartItems.innerHTML = '';

            var total = 0;
            cart.forEach(function(item, index) {
                total += item.price * item.quantity;
                var div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = '<span>' + item.name + '</span>' +
                    '<div class="qty">' +
                    '<button onclick="changeQty(' + index + ', -1)">-</button>' +
                    '<span>' + item.quantity + '</span>' +
                    '<button onclick="changeQty(' + index + ', 1)">+</button>' +
                    '</div>' +
                    '<span>¥' + (item.price * item.quantity).toFixed(2) + '</span>';
                cartItems.appendChild(div);
            });

            cartTotal.textContent = total.toFixed(2);
        }

        // 修改数量
        function changeQty(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            } else if (cart[index].quantity > cart[index].maxStock) {
                cart[index].quantity = cart[index].maxStock;
                showAlert('库存不足', 'warning');
            }
            updateCartUI();
        }

        // 清空购物车
        function clearCart() {
            cart = [];
            document.getElementById('orderRemark').value = '';
            updateCartUI();
        }

        // 提交订单
        function submitOrder() {
            if (cart.length === 0) {
                showAlert('购物车为空', 'warning');
                return;
            }

            var items = cart.map(function(item) {
                return {
                    coffeeId: item.coffeeId,
                    quantity: item.quantity
                };
            });

            var remark = document.getElementById('orderRemark').value;

            post('/order', { items: items, remark: remark }, function(res) {
                if (res.code === 200) {
                    showAlert('下单成功！', 'success');
                    clearCart();
                    loadMenu();
                    loadOrders();
                } else {
                    showAlert(res.message || '下单失败', 'error');
                }
            });
        }

        // 加载订单
        function loadOrders() {
            get('/order/page?pageSize=20', function(res) {
                var list = document.getElementById('orderList');
                var empty = document.getElementById('orderEmpty');

                if (res.code === 200 && res.data && res.data.records && res.data.records.length > 0) {
                    list.innerHTML = '';
                    empty.style.display = 'none';

                    res.data.records.forEach(function(order) {
                        var div = document.createElement('div');
                        div.className = 'order-item';

                        var itemsStr = '';
                        if (order.items) {
                            order.items.forEach(function(item) {
                                itemsStr += item.coffeeName + ' x' + item.quantity + '  ';
                            });
                        }

                        div.innerHTML = '<div class="order-header">' +
                            '<span class="order-no">#' + order.orderNo.slice(-6) + '</span>' +
                            '<span class="' + getStatusClass(order.status) + '">' + getStatusName(order.status) + '</span>' +
                            '</div>' +
                            '<div style="color:#808080; font-size:13px; margin-bottom:8px;">' + itemsStr + '</div>' +
                            '<div style="display:flex; justify-content:space-between; font-size:12px;">' +
                            '<span>' + formatTime(order.createdAt) + '</span>' +
                            '<span style="font-weight:bold; color:#8B4513;">¥' + order.totalAmount + '</span>' +
                            '</div>';

                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = '';
                    empty.style.display = 'block';
                }
            });
        }

        // 初始化
        loadMenu();
        loadOrders();

        // 定时刷新订单
        setInterval(loadOrders, 10000);
    </script>
</body>
</html>
