<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素咖啡店 - 顾客</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- ====== 新增: 咖啡杯和聊天窗口样式 ====== -->
    <style>
        /* 咖啡杯按钮 */
        #coffee-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            cursor: pointer;
            z-index: 1000;
        }

        /* 聊天窗口 */
        #chat-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 300px;
            height: 400px;
            background: white;
            border: 1px solid #ccc;
            display: none; /* 默认隐藏 */
            flex-direction: column;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1001;
        }

        /* 消息区域 */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 14px;
        }

        /* 输入区域 */
        #chat-input {
            display: flex;
            border-top: 1px solid #ddd;
        }

        #chat-input input {
            flex: 1;
            padding: 5px;
            border: none;
            outline: none;
        }

        #chat-input button {
            padding: 5px 10px;
            border: none;
            background: #4169E1;
            color: white;
            cursor: pointer;
        }

        /* 消息样式 */
        p.user {
            text-align: right;
            margin: 5px 0;
            color: #333;
        }

        p.assistant {
            text-align: left;
            margin: 5px 0;
            color: #4169E1;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <h1>☕ 像素咖啡店</h1>
        <div class="user-info">
            <span id="userName"></span>
            <span class="status status-pending" style="background:#4169E1;color:white;">顾客</span>
            <button class="btn btn-small" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <!-- 咖啡菜单 -->
        <div class="card">
            <div class="card-title">咖啡菜单</div>
            <div id="menuGrid" class="grid grid-4"></div>
            <div id="menuEmpty" class="empty" style="display:none;">
                <div class="empty-icon">☕</div>
                <p>暂无咖啡</p>
            </div>
        </div>

        <!-- 我的订单 -->
        <div class="card">
            <div class="card-title">我的订单</div>
            <div id="orderList"></div>
            <div id="orderEmpty" class="empty" style="display:none;">
                <div class="empty-icon">📋</div>
                <p>暂无订单</p>
            </div>
        </div>
    </div>

    <!-- 购物车 -->
    <div id="cart" class="cart" style="display:none;">
        <div class="cart-title">🛒 购物车</div>
        <div id="cartItems"></div>
        <div class="cart-total">总计: ¥<span id="cartTotal">0.00</span></div>
        <div class="form-group">
            <input type="text" id="orderRemark" class="input" placeholder="备注（可选）">
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="clearCart()">清空</button>
            <button class="btn btn-primary" onclick="submitOrder()">下单</button>
        </div>
    </div>

    <!-- ====== 新增: 咖啡杯按钮 ====== -->
    <img src="assets/coffee.png" id="coffee-btn" alt="聊天助手">

    <!-- ====== 新增: 聊天窗口 ====== -->
    <div id="chat-window">
        <div id="chat-messages"></div>
        <div id="chat-input">
            <input type="text" id="input-message" placeholder="输入消息...">
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // 检查登录
        var user = checkLogin();
        if (user) {
            document.getElementById('userName').textContent = user.nickname || user.username;
        }

        // 购物车数据
        var cart = [];

        // ====== 你的现有菜单和订单加载、购物车逻辑保持不变 ======
        loadMenu();
        loadOrders();
        setInterval(loadOrders, 10000);

        // ====== 新增: 咖啡杯聊天逻辑 ======
        const coffeeBtn = document.getElementById("coffee-btn");
        const chatWindow = document.getElementById("chat-window");
        const chatMessages = document.getElementById("chat-messages");
        const inputMessage = document.getElementById("input-message");
        const sendBtn = document.getElementById("send-btn");

        // 随机生成 sessionId
        const sessionId = "sess-" + Math.random().toString(36).substring(2,10);

        // 点击咖啡杯显示/隐藏聊天窗口
        coffeeBtn.onclick = () => {
            chatWindow.style.display = chatWindow.style.display === "none" ? "flex" : "none";
        };

        // 显示消息
        function appendMessage(role, text) {
            const p = document.createElement("p");
            p.className = role;
            p.textContent = role === "user" ? "你: " + text : "AI: " + text;
            chatMessages.appendChild(p);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 发送消息
        async function sendMessage() {
            const message = inputMessage.value.trim();
            if (!message) return;
            appendMessage("user", message);
            inputMessage.value = "";

            try {
                const res = await fetch("http://localhost:3000/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message, sessionId })
                });
                const data = await res.json();
                appendMessage("assistant", data.reply);
            } catch (e) {
                appendMessage("assistant", "调用接口失败：" + e.message);
            }
        }

        // 绑定按钮和回车
        sendBtn.onclick = sendMessage;
        inputMessage.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
